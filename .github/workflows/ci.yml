name: CI

on:
  pull_request:
  push:
    branches: [main]

# 同じブランチで新しい実行が始まったら、古い実行は打ち切る
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# wrangler.jsonc と cloudflare-env.d.ts は実 ID や生成物なので追跡していない。
# CI では雛形に仮の値を入れて生成してから検証する。
env:
  D1_DATABASE_ID: placeholder-database-id
  APP_HOSTNAME: placeholder.example.com

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      # Cloudflare Workers Builds も npm ci を使うため、ここでも ci で検証する
      - run: npm ci --no-audit --no-fund
      - name: Generate Cloudflare bindings types
        run: npm run cf:config && npm run cf-typegen
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Generate Cloudflare bindings types
        run: npm run cf:config && npm run cf-typegen
      - name: Build
        run: npm run cf:build
